name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook (latest release)
        run: |
          mkdir -p "$HOME/mdbook-bin"
          url=$(curl -s https://api.github.com/repos/rust-lang/mdBook/releases/latest \
            | grep "browser_download_url.*x86_64-unknown-linux-gnu.tar.gz" \
            | cut -d '"' -f 4)
          curl -sSL "$url" | tar -xz -C "$HOME/mdbook-bin"
          echo "$HOME/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
